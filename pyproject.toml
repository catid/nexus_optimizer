[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nexus-optimizer"
version = "0.1.0"
description = "Algorithm 3 Nexus optimizer with DDP-safe normalized inner updates"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["torch>=2.1"]
license = { text = "MIT" }
authors = [{ name = "catid" }]

[project.optional-dependencies]
dev = ["pytest>=7"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
